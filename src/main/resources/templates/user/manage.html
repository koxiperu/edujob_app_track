<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Manage Users'">Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>

<main class="container my-5 wid">

    <h1 class="mb-0" th:text="${title}">Manage Users</h1>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-warning shadow-orange">
        <strong>No users found.</strong> 
        You can add new users via registration.
    </div>

    <div th:if="${!#lists.isEmpty(users)}" class="card shadow-orange p-3">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Username</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}">Username</td>
                    <td th:text="${user.firstName}">First Name</td>
                    <td th:text="${user.lastName}">Last Name</td>
                    <td th:text="${user.email}">Email</td>
                    <td th:text="${user.phone != null ? user.phone : '-'}">Phone</td>
                    
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/user/edit/{id}(id=${user.id})}" class="btn submit-button text-white btn-sm">Edit</a>
                            <form th:action="@{/user/delete/{id}(id=${user.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    th:disabled="${user.username == #authentication.name}">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

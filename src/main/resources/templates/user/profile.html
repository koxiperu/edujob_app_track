<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${title}">My Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom profile styling -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="bg-profile">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Main Content -->
<main class="container my-5" style="max-width: 800px;">
    <h1 class="text-center mb-4">My Profile</h1>
    <div class="card shadow-orange p-4">
        <div th:if="${param.updated}" class="alert alert-success">
            Profile updated successfully!
        </div>

        

        <div class="profile-info mb-4">
            <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>First Name:</strong> <span th:text="${user.firstName}"></span></p>
            <p><strong>Last Name:</strong> <span th:text="${user.lastName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
            <p><strong>Birth Date:</strong> <span th:text="${user.birthDate}"></span></p>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/user/edit}" class="btn submit-button text-white">
                Edit Profile
            </a>

            <form th:action="@{/user/delete}" method="post"
                  onsubmit="return confirm('Are you sure you want to delete your account?');">
                <button type="submit" class="btn btn-danger">
                    Delete Account
                </button>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

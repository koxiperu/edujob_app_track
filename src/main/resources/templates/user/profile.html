<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${title}">My Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header -->
<div class="header">
    <h1>Application Tracker</h1>
</div>

<!-- Navbar -->
<div class="navbar">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/applications}">Applications</a>
    <a th:href="@{/institutions}">Institutions</a>
    <a th:href="@{/documents}">Documents</a>
    <a th:href="@{/user/profile}">Profile</a>
    <span class="nav-right">
        <span sec:authentication="name"></span>
        <a th:href="@{/logout}">Logout</a>
    </span>
</div>

<!-- Main Content -->
<main class="container user">
    <div class="card">
        <div th:if="${param.updated}" style="color:green;">
            Profile updated successfully!
        </div>
        <h2>My Profile</h2>

        <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
        <p><strong>First Name:</strong> <span th:text="${user.firstName}"></span></p>
        <p><strong>Last Name:</strong> <span th:text="${user.lastName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
        <p><strong>Birth Date:</strong> <span th:text="${user.birthDate}"></span></p>

        <div>
            <a th:href="@{/user/edit}" class="button">Edit Profile</a>
        </div>

        <form th:action="@{/user/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete your account?');">
            <button type="submit" class="button" style="background-color: #EB691F;">Delete Account</button>
        </form>
    </div>
</main>

<!-- Footer -->
<div class="footer">
    <p>© 2025 Application Tracker</p>
</div>

</body>
</html>

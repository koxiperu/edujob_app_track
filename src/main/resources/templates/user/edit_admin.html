<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${title} ?: 'Edit User'">Edit User</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>

<main class="container d-flex justify-content-center my-5">
    <div class="card p-4 shadow-orange form-shell" style="width: 100%; max-width: 500px;">
        <h2 class="text-center mb-4">Edit User</h2>

        <form th:action="@{/user/edit/{id}(id=${user.id})}" th:object="${user}" method="post" th:csrf="true">
            <input type="hidden" th:field="*{id}" />

            <div class="border p-3 mb-3 form-section">
                <label class="form-label">First Name</label>
                <input type="text" th:field="*{firstName}" class="form-control" required />
                <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></p>
            </div>

            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Last Name</label>
                <input type="text" th:field="*{lastName}" class="form-control" required />
                <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></p>
            </div>

            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
            </div>

            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control" />
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></p>
            </div>

            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Username</label>
                <input type="text" th:field="*{username}" class="form-control" required />
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></p>
            </div>

            <!-- Optional: Role selection -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Role</label>
                <select th:field="*{role.id}" class="form-select">
                    <option th:each="r : ${roles}"
                            th:value="${r.id}"
                            th:text="${r.name}">
                    </option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary submit-button">Save Changes</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

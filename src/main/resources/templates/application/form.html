<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Application Tracker'">Application Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container forms">
    <div class="card">
        <h1 th:text="${title}">Application Form</h1>

        <form th:object="${application}" method="post" th:action="@{${application.id} != null ? '/applications/' + ${application.id} + '/edit' : '/applications'}" th:csrf="true">

            <input type="hidden" th:field="*{id}" />
            <label>Title *</label>
            <input th:field="*{title}" required>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

            <label>Description</label>
            <textarea th:field="*{description}"></textarea>

            <label>Type *</label>
            <select th:field="*{applicationType}" required>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>

            <label>Status *</label>
            <select th:field="*{status}" required>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>

            <label>Institution *</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select th:field="*{institution}" required style="flex: 1;">
                    <option value="">-- Select institution --</option>
                    <option th:each="inst : ${institutions}"
                            th:value="${inst.id}"
                            th:text="${inst.name}">
                    </option>
                </select>
                <a th:href="@{/institutions/new(returnUrl=${returnUrl})}"
                class="button">
                    + Add
                </a>
            </div>

            <label>Submission Date</label>
            <input type="date" th:field="*{submitDate}">

            <label>Submission Deadline</label>
            <input type="date" th:field="*{submitDeadline}">

            <label>Response Deadline</label>
            <input type="date" th:field="*{responseDeadline}">

            <label>Response Status</label>
            <select th:field="*{responseStatus}">
                <option th:each="rs : ${responseStatuses}" th:value="${rs}" th:text="${rs}"></option>
            </select>

            <label>Result Notes</label>
            <textarea th:field="*{resultNotes}"></textarea>

            <button type="submit" class="button">Save</button>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
    <title th:text="${title} ?: 'Application Tracker'">Application Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container forms">
    <div class="card">
        <h1 th:text="${title}">Application Form</h1>

        <form th:object="${application}" method="post"
              th:action="@{${application.id} != null ? '/applications/' + ${application.id} + '/edit' : '/applications'}"
              th:csrf="true">

            <input type="hidden" th:field="*{id}" />

            <label>Title *</label>
            <input th:field="*{title}" required>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

            <label>Description</label>
            <textarea th:field="*{description}"></textarea>

            <label>Type *</label>
            <select th:field="*{applicationType}" required>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>

            <label>Status *</label>
            <select th:field="*{status}" required>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>

            <label>Institution *</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select th:field="*{institution}" required style="flex: 1;">
                    <option value="">-- Select institution --</option>
                    <option th:each="inst : ${institutions}" th:value="${inst.id}" th:text="${inst.name}"></option>
                </select>
                <a th:href="@{/institutions/new(returnUrl=${returnUrl})}" class="button">+ Add</a>
            </div>

            <!-- Documents Section -->
            <label>Documents</label>
            <p>Number of documents: <span th:text="${application.documents != null ? application.documents.size() : 0}"></span></p>

            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                <a th:href="@{/documents/new(returnUrl=${returnUrl})}" class="button">+ Create New Document</a>
            </div>

            <!-- Documents Table -->
            <table id="documentsTable" style="width: 80%; margin-bottom: 10px;">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc: ${app_docs}">
                        <td><input type="hidden" name="documentIds" th:value="${doc.id}" /></td>
                        <td th:text="${doc.fileName}"></td>
                        <td th:text="${doc.status != null ? doc.status : '-'}"></td>
                        <td>
                            <button type="button" class="button danger small" onclick="removeDocumentRow(this)">x</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Add Existing Document -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="addDocumentSelect" style="flex: 1;">
                    <option value="">-- Select document --</option>
                    <option th:each="doc : ${documents}" th:value="${doc.id}" th:text="${doc.fileName}" th:attr="data-status=${doc.status}"></option>
                </select>
                <button type="button" class="button" onclick="attachDocument()">Attach</button>
            </div>


            <label>Submission Date</label>
            <input type="date" th:field="*{submitDate}">

            <label>Submission Deadline</label>
            <input type="date" th:field="*{submitDeadline}">

            <label>Response Deadline</label>
            <input type="date" th:field="*{responseDeadline}">

            <label>Response Status</label>
            <select th:field="*{responseStatus}">
                <option th:each="rs : ${responseStatuses}" th:value="${rs}" th:text="${rs}"></option>
            </select>

            <label>Result Notes</label>
            <textarea th:field="*{resultNotes}"></textarea>

            <button type="submit" class="button">Save</button>
        </form>
    </div>
</main>

<script th:inline="javascript">
    function removeDocumentRow(button) {
        const row = button.closest('tr');
        // Remove hidden input
        row.querySelectorAll('input[name="documentIds"]').forEach(i => i.remove());
        // Remove row from table
        row.remove();
    }

    function attachDocument() {
        const select = document.getElementById('addDocumentSelect');
        const docId = select.value;
        const docName = select.options[select.selectedIndex].text;
        const docStatus = select.options[select.selectedIndex].getAttribute('data-status') || '-';
        if (!docId) return;

        const table = document.getElementById('documentsTable').querySelector('tbody');

        // Prevent duplicates
        if ([...table.querySelectorAll('tr')].some(r => r.dataset.id === docId)) return;

        const tr = document.createElement('tr');
        tr.dataset.id = docId;

        // Hidden input
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'documentIds';
        input.value = docId;
        tr.appendChild(input);

        // File name cell
        const tdName = document.createElement('td');
        tdName.textContent = docName;
        tr.appendChild(tdName);

        // Status cell
        const tdStatus = document.createElement('td');
        tdStatus.textContent = docStatus;
        tr.appendChild(tdStatus);

        // Action cell
        const tdAction = document.createElement('td');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'button danger small';
        btn.textContent = 'x';
        btn.onclick = () => removeDocumentRow(btn);
        tdAction.appendChild(btn);
        tr.appendChild(tdAction);

        table.appendChild(tr);
    }

</script>


<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

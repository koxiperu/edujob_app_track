<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Application Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom profile styling -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="bg-profile">

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Main Content -->
<main class="container my-5" style="max-width: 800px;">
    <h1 class="text-center mb-0">Application Details</h1>

    <div class="card shadow-orange p-4">

        <!-- Info fields -->
        <div class="profile-info mb-4">
            <p><strong>Title:</strong> <span th:text="${app.title != null ? app.title : '-'}"></span></p>
            <p><strong>Institution:</strong> <span th:text="${app.institution != null ? app.institution.name : '-'}"></span></p>
            <p><strong>Type:</strong> <span th:text="${app.applicationType != null ? app.applicationType : '-'}"></span></p>
            <p><strong>Status:</strong> <span th:text="${app.status != null ? app.status : '-'}"></span></p>
            <p><strong>Response Status:</strong> <span th:text="${app.responseStatus != null ? app.responseStatus : '-'}"></span></p>
            <p><strong>Creation Date:</strong> <span th:text="${app.creationDate != null ? app.creationDate : '-'}"></span></p>
            <p><strong>Submission Date:</strong> <span th:text="${app.submitDate != null ? app.submitDate : '-'}"></span></p>
            <p><strong>Submission Deadline:</strong> <span th:text="${app.submitDeadline != null ? app.submitDeadline : '-'}"></span></p>
            <p><strong>Response Deadline:</strong> <span th:text="${app.responseDeadline != null ? app.responseDeadline : '-'}"></span></p>

            <!-- Documents -->
            <p><strong>Documents:</strong></p>

            <ul th:if="${!#lists.isEmpty(app.documents)}" class="ms-3">
                <li th:each="doc : ${app.documents}">
                    <a th:href="@{/documents/{id}/download(id=${doc.id})}"
                    th:text="${doc.fileName}">
                    </a>
                </li>
            </ul>

            <p th:if="${#lists.isEmpty(app.documents)}">-</p>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-between mt-3">
            <a th:href="@{/dashboard}" class="btn submit-button text-white">
                Back to dashboard
            </a>

            <div class="d-flex gap-2">
                <a th:href="@{/applications/{id}/edit(id=${app.id})}" class="btn submit-button text-white">
                    Edit
                </a>
                <form th:action="@{/applications/{id}/delete(id=${app.id})}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this application?');">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

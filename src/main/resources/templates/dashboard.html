<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Application Tracker'">Application Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container dashboard">
<div>
    <h1>Dashboard</h1>
    <p>Welcome, <strong th:text="${username}">User</strong>!</p>


    <!-- Example card for user's applications (later you can add a table) -->
    <div class="card">
        <form method="get" th:action="@{/dashboard}">
            <label for="status">Filter by status:</label>
            <select name="status" id="status">
                <option value="">All</option>
                <option th:each="st : ${statuses}"
                        th:value="${st}"
                        th:text="${st}"
                        th:selected="${st == selectedStatus}">
                </option>
            </select>
            <button class="button" type="submit">Filter</button>
        </form>
    </div>

    <div class="card">
        <h2>Your Applications</h2>

        <table th:if="${applications.size() > 0}">
            <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Status</th>
                <th>Deadline</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${applications}">
                <td th:text="${app.title}"></td>
                <td th:text="${app.applicationType}"></td>
                <td th:text="${app.status}"></td>
                <td th:text="${app.submitDeadline}"></td>
            </tr>
            </tbody>
        </table>

        <p th:if="${applications.size() == 0}">
            No applications found.
        </p>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

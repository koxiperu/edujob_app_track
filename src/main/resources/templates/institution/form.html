<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Application Tracker'">Application Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom form CSS -->
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>

<body class="bg-image bg-body">

<!-- Base layout fragments -->
<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow-orange form-shell" style="width: 100%; max-width: 600px;">

        <h2 class="text-center mb-4" th:text="${title}">Institution Form</h2>

        <form th:object="${institution}"
              th:action="${institution.id == null} ? @{/institutions} : @{/institutions/{id}/edit(id=${institution.id})}"
              method="post"
              th:csrf="true">

            <input type="hidden" name="returnUrl" th:value="${returnUrl}">

            <!-- Name -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Name *</label>
                <input th:field="*{name}" class="form-control">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <!-- Type -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Type *</label>
                <select th:field="*{type}" class="form-select">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <!-- Country -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Country</label>
                <input th:field="*{country}" class="form-control">
            </div>

            <!-- Email -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Email</label>
                <input th:field="*{email}" class="form-control">
            </div>

            <!-- Website -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Website</label>
                <input th:field="*{website}" class="form-control">
            </div>

            <!-- Address -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Address</label>
                <input th:field="*{address}" class="form-control">
            </div>

            <!-- Phone -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Phone</label>
                <input th:field="*{phone}" class="form-control">
            </div>

            <!-- Submit -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary submit-button">
                    Save
                </button>
            </div>

        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

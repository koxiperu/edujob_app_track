<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Institution</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="header">Application Tracker</div>

<div class="navbar">
    <a th:href="@{/institutions}">Back</a>
</div>

<main class="container forms">
    <div class="card">
        <h1 th:text="${title}"></h1>

        <form th:object="${institution}" th:action="${institution.id == null} ? @{/institutions} : @{/institutions/{id}/edit(id=${institution.id})}" method="post" th:csrf="true">

            <label>Name</label>
            <input th:field="*{name}">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label>Type</label>
            <select th:field="*{type}">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>

            <label>Country</label>
            <input th:field="*{country}">

            <label>Email</label>
            <input th:field="*{email}">

            <label>Website</label>
            <input th:field="*{website}">

            <label>Address</label>
            <input th:field="*{address}">

            <label>Phone</label>
            <input th:field="*{phone}">

            <button type="submit" class="button">Save</button>
        </form>
    </div>
</main>

</body>
</html>

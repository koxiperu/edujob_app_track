<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Application Tracker'">Institutions</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom list styling -->
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container-fluid my-5" style="width: 90% !important; max-width: 90% !important;">

    <!-- Page Title & Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="${title}">Institutions</h1>
        <a th:href="@{/institutions/new}" class="btn submit-button text-white">
            Add Institution
        </a>
    </div>

    <!-- Loop through institution groups -->
    <div th:each="entry : ${groupedInstitutions}" th:if="${!#lists.isEmpty(entry.value)}" class="mb-5">
        <h2 class="table-title" th:text="${entry.key}">Institution Type</h2>
        <div class="card shadow-orange p-3">
            <table class="table table-bordered table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:20%;">Name</th>
                        <th style="width:10%;">Country</th>
                        <th style="width:15%;">Address</th>
                        <th style="width:10%;">Phone</th>
                        <th style="width:10%;">Email</th>
                        <th style="width:10%;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inst : ${entry.value}">
                        <td th:text="${inst.name != null ? inst.name : '-'}"></td>
                        <td th:text="${inst.country != null ? inst.country : '-'}"></td>
                        <td th:text="${inst.address != null ? inst.address : '-'}"></td>
                        <td th:text="${inst.phone != null ? inst.phone : '-'}"></td>
                        <td th:text="${inst.email != null ? inst.email : '-'}"></td>
                        <td style="width: max-content;">
                            <div class="d-flex gap-2">
                                <a th:href="@{/institutions/{id}/edit(id=${inst.id})}" class="btn submit-button text-white btn-sm">Edit</a>
                                <form th:action="@{/institutions/{id}/delete(id=${inst.id})}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Institutions'">Institutions</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom list styling -->
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-responsive.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>

<main class="container my-5 wid">

    <!-- Page Title & Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="${title}">Companies</h1>
        <a th:href="@{/institutions/new}" class="btn submit-button text-white">
            Add Company
        </a>
    </div>
    <div th:if="${noInstitutions}" class="alert alert-warning shadow-orange">
        <strong>No companies found.</strong>
        You can create a new company using the button above.
    </div>
    <!-- Loop through institution groups -->
    <div th:each="entry : ${groupedInstitutions}" th:if="${!#lists.isEmpty(entry.value)}" class="mb-5">
        <h2 class="table-title" th:text="${entry.key}">Company Type</h2>
        <div class="card shadow-orange p-3 table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:25%;">Name</th>
                        <th style="width:10%;">Country</th>
                        <th style="width:20%;">Address</th>
                        <th style="width:10%;">Phone</th>
                        <th style="width:15%;">Email</th>
                        <th style="width:20%;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inst : ${entry.value}">
                        <td th:text="${inst.name != null ? inst.name : '-'}"></td>
                        <td th:text="${inst.country != null ? inst.country : '-'}"></td>
                        <td th:text="${inst.address != null ? inst.address : '-'}"></td>
                        <td th:text="${inst.phone != null ? inst.phone : '-'}"></td>
                        <td th:text="${inst.email != null ? inst.email : '-'}"></td>
                        <td style="width: max-content;">
                            <div class="d-flex gap-2">
                                <a th:href="@{/institutions/{id}/edit(id=${inst.id})}" class="btn submit-button text-white btn-sm">
                                    <span class="btn-text">Edit</span>
                                    <i class="bi bi-pencil-fill btn-icon"></i>
                                </a>
                                <form th:action="@{/institutions/{id}/delete(id=${inst.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <span class="btn-text">Delete</span>
                                        <i class="bi bi-trash-fill btn-icon"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

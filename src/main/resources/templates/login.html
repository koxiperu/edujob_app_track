<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom form CSS -->
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body class="bg-image bg-body">

<main class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-orange form-shell" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">Login</h2>

        <form th:action="@{/login}" method="post">
            <div class="mt-3 text-success" th:if="${param.registered}">
                Registration successful! Please login.
            </div>
            <div class="border p-3 mb-3 form-section">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="border p-3 mb-3 form-section">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary submit-button">Login</button>
            </div>
        </form>

        <div class="mt-3 text-danger" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="mt-3 text-success" th:if="${param.logout}">
            You have been logged out.
        </div>
        <div class="mt-3 text-center">
            <span>Don't have an account yet? </span>
            <a th:href="@{/register}" class="btn additional">Create an account</a>
        </div>
    </div>
</main>

</body>
</html>

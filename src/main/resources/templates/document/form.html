<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Document Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom form CSS -->
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>

<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-orange form-shell" style="width: 100%; max-width: 600px;">

        <h2 class="text-center mb-4" th:text="${title}">Document Form</h2>

        <form th:object="${document}"
              th:action="@{${document.id} != null ? '/documents/' + ${document.id} + '/edit' : '/documents'}"
              method="post"
              enctype="multipart/form-data"
              th:csrf="true">

            <input type="hidden" th:field="*{id}" />

            <!-- File -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">
                    File <span th:if="${document.id == null}" class="text-danger">*</span>
                </label>
                <input type="file"
                       name="file"
                       class="form-control"
                       th:attr="required=${document.id == null}" />
            </div>

            <!-- File Name -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">File Name</label>
                <input type="text"
                       th:field="*{fileName}"
                       class="form-control"
                       placeholder="Optional, will use uploaded file name if empty">
            </div>

            <!-- Content Type -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Content Type</label>
                <input type="text"
                       th:field="*{contentType}"
                       class="form-control"
                       placeholder="e.g., pdf, docx, png">
            </div>

            <!-- Status -->
            <div class="border p-3 mb-3 form-section">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
            </div>

            <!-- Submit -->
            <div class="d-grid">
                <button type="submit"
                        class="btn submit-button"
                        th:text="${document.id != null ? 'Update' : 'Upload'}">
                </button>
            </div>

        </form>

    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} ?: 'Documents'">Documents</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom list styling -->
    <link rel="stylesheet" th:href="@{/css/list.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-responsive.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>

<main class="container my-5 wid">

    <!-- Page Title & Upload Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Documents</h1>
        <a th:href="@{/documents/new}" class="btn submit-button text-white">
            Upload Document
        </a>
    </div>

    <!-- Documents Table Card -->
<div th:if="${!#lists.isEmpty(documents)}" class="card shadow-orange p-3 table-responsive">
    <table class="table table-bordered table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>File Name</th>
                <th>Content</th>
                <th>Status</th>
                <th style="width:10%;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doc : ${documents}">
                <td th:text="${doc.fileName}"></td>
                <td th:text="${doc.contentType != null ? doc.contentType : '-'}"></td>
                <td th:text="${doc.status != null ? doc.status : '-'}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <a th:href="@{/documents/{id}/download(id=${doc.id})}" class="btn download-button btn-sm">
                            <span class="btn-text">Download</span>
                            <i class="bi bi-download btn-icon"></i>
                        </a>
                        <a th:href="@{/documents/{id}/edit(id=${doc.id})}" class="btn submit-button text-white btn-sm">
                            <span class="btn-text">Edit</span>
                            <i class="bi bi-pencil-fill btn-icon"></i>
                        </a>
                        <form th:action="@{/documents/{id}/delete(id=${doc.id})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <span class="btn-text">Delete</span>
                                <i class="bi bi-trash-fill btn-icon"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div th:if="${#lists.isEmpty(documents)}" class="alert alert-warning shadow-orange">
    <strong>No documents found. You can upload new documents using the button above.</strong>
</div>


</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

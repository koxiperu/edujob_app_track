<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Documents</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom list styling -->
    <link rel="stylesheet" th:href="@{/css/list.css}">
</head>
<body class="bg-image bg-body">

<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container my-5 wid">

    <!-- Page Title & Upload Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Documents</h1>
        <a th:href="@{/documents/new}" class="btn submit-button text-white">
            Upload Document
        </a>
    </div>

    <!-- Documents Table Card -->
    <div class="card shadow-orange p-3">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>File Name</th>
                    <th>Content</th>
                    <th>Status</th>
                    <th style="width: 220px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${documents}">
                    <td th:text="${doc.fileName}"></td>
                    <td th:text="${doc.contentType != null ? doc.contentType : '-'}"></td>
                    <td th:text="${doc.status != null ? doc.status : '-'}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/documents/{id}/download(id=${doc.id})}" class="btn download-button btn-sm">
                                Download
                            </a>
                            <a th:href="@{/documents/{id}/edit(id=${doc.id})}" class="btn submit-button text-white btn-sm">
                                Edit
                            </a>
                            <form th:action="@{/documents/{id}/delete(id=${doc.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

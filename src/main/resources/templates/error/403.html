<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>403 – Access Denied</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your main CSS -->
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>

<body class="bg-profile" 
      th:style="'background-image: url(' + @{/images/access_deny.jpg} + '); background-repeat: no-repeat; background-position: center center; background-attachment: fixed; background-size: cover;'">


<!-- Header / Navbar -->
<div th:replace="fragments/header :: header"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container d-flex justify-content-center align-items-center">
    <div class="card shadow-orange p-5 text-center" style="max-width: 600px; width: 100%;">
        
        <h1 class="mb-4 text-center">403</h1>

        <h2 class="mb-3">Access Denied</h2>

        <p class="mb-4">
            You do not have permission to access this page.<br>
            This section is restricted to administrators only.
        </p>

        <div class="d-grid gap-2">
            <a th:href="@{/dashboard}" class="btn submit-button">
                Back to Dashboard
            </a>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>

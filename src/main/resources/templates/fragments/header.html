<div xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="header"
     class="app-header">

    <!-- Top Row of Header -->
    <div class="header-top-row">
        <!-- LEFT (Existing header content) -->
        <div class="header-left">
            <img src="/images/logo.jpg" alt="Logo" class="app-logo"/>

            <div class="title-container">
                <div class="app-title">EduJob Application Tracker</div>
                <div class="app-slogan">Manage your future, one application at a time</div>
            </div>
        </div>

        <!-- RIGHT (User Profile/Logout) -->
        <div class="header-right">
            <a th:href="@{/user/profile}" class="user-link" title="My profile">
                <span class="user-badge" style="position: relative;">
                    <img src="/images/profile-icon.jpg" alt="Profile"/>
                    <span class="username-text" sec:authentication="name"></span>
                </span>
            </a>

            <a th:href="@{/logout}" class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>

    <!-- Bottom Row (Navbar) -->
    <div class="nav-container-wrapper">
        <div class="nav-container" id="navContainer">
            <button class="menu-button" onclick="toggleNav()">
                <span class="menu-icon"></span>
                Menu
            </button>

            <div class="nav-links" id="navLinks">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/applications}">Applications</a>
                <a th:href="@{/institutions}">Companies</a>
                <a th:href="@{/documents}">Documents</a>
                <a th:href="@{/user/profile}">Profile</a>
                <a th:href="@{/user/manage}" sec:authorize="hasRole('ADMIN')">Manage Users</a>
            </div>
        </div>
    </div>

    <!-- JS Script -->
    <script>
        function toggleNav() {
            const container = document.getElementById('navContainer');
            container.classList.toggle('open');
        }
    </script>
</div>
